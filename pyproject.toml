[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbelt"
dynamic = ["version"]
description = "Command-line tools for coding agents: dev-server management, large-file summaries, and repo diagnostics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["agents", "llm", "cli", "developer-tools", "dev-server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
pw = "agentbelt.pw:main"
peek = "agentbelt.peek:main"
doctor = "agentbelt.doctor:main"

[tool.setuptools.dynamic]
version = { attr = "agentbelt.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
